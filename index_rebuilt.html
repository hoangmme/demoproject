<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Hồ sơ - MVP</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <script defer src="js/alpine.min.js"></script>
    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:8055' 
            : '/api';
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased" x-data="appData()">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-[linear-gradient(118deg,#447f28_32.46%,#015301_91.42%)] text-white flex flex-col shadow-xl z-20">
            <div class="p-6 text-center border-b border-white/20">
                <h1 class="text-2xl font-bold tracking-wider">HỒ SƠ CÁN BỘ</h1>
                <p class="text-sm opacity-80 mt-1">Version 2.1</p>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#" @click.prevent="currentView = 'canbo'" :class="currentView === 'canbo' ? 'bg-white/20 font-semibold' : 'bg-white/5 hover:bg-white/10'" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Quản lý Cán bộ
                </a>
                
                <div class="pt-4 pb-2 px-2 text-xs font-semibold text-white/50 uppercase tracking-wider">Báo cáo Phụ lục</div>
                
                <a href="#" @click.prevent="currentView = 'pl1'" :class="currentView === 'pl1' ? 'bg-white/20 font-semibold' : 'hover:bg-white/10'" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    PL1: Đi nước ngoài
                </a>
                <a href="#" @click.prevent="currentView = 'pl2'" :class="currentView === 'pl2' ? 'bg-white/20 font-semibold' : 'hover:bg-white/10'" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    PL2: Thân nhân NN
                </a>
                <a href="#" @click.prevent="currentView = 'pl3'" :class="currentView === 'pl3' ? 'bg-white/20 font-semibold' : 'hover:bg-white/10'" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    PL3: Lịch sử & Lưu ý
                </a>

                <div class="pt-4 pb-2 px-2 text-xs font-semibold text-white/50 uppercase tracking-wider">Cấu hình</div>
                <a href="#" class="flex items-center gap-3 px-4 py-2 hover:bg-white/10 rounded-lg transition-colors text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    Danh mục Phòng ban
                </a>
                
                <div class="pt-4 pb-2 px-2 text-xs font-semibold text-white/50 uppercase tracking-wider" x-show="currentUser && isAdmin()">Hệ thống</div>
                <a href="#" x-show="currentUser && isAdmin()" @click.prevent="currentView = 'users'" :class="currentView === 'users' ? 'bg-white/20 font-semibold' : 'hover:bg-white/10'" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Quản lý Người dùng
                </a>
                <a href="#" x-show="currentUser && isAdmin()" @click.prevent="currentView = 'audit_global'" :class="currentView === 'audit_global' ? 'bg-white/20 font-semibold' : 'hover:bg-white/10'" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Nhật ký Hệ thống
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col relative overflow-hidden bg-gray-100">
            
            <!-- HEADER (Dynamic based on View) -->
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8 z-10 flex-shrink-0">
                <h2 class="text-xl font-semibold text-gray-800" x-text="getViewTitle()"></h2>
                
                <!-- Actions for Cán bộ view -->
                <div x-show="currentView === 'canbo'" class="flex items-center gap-4">
                    <div class="relative">
                        <input type="text" x-model="searchQuery" placeholder="Tìm kiếm tên, CCCD..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#447f28] w-64">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <button @click="saveUser()" class="w-full bg-[#447f28] hover:bg-[#366620] text-white py-3 rounded-lg font-bold shadow-md transition-colors mt-6">TẠO TÀI KHOẢN / CẬP NHẬT</button>
            </div>
        </div>
    </div>
</body>
</html>
