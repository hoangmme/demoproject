<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Cán bộ (Demo)</title>
    <!-- Thư viện biểu tượng -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style chính -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="sidebar-mini">
    <div class="wrapper">
        <!-- Header -->
        <header class="main-header">
            <a href="#" class="logo">
                <span class="logo-mini"><b>QL</b></span>
                <span class="logo-lg"><b>Quản Lý</b> Cán Bộ</span>
            </a>
            <nav class="navbar navbar-static-top">
                <a href="#" class="sidebar-toggle" data-toggle="push-menu" role="button">
                    <i class="fas fa-bars"></i>
                </a>
                <div class="navbar-custom-menu">
                    <ul class="nav navbar-nav">
                        <li>
                            <a href="#"><i class="fas fa-user"></i> Admin</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Sidebar -->
        <aside class="main-sidebar">
            <section class="sidebar">
                <ul class="sidebar-menu">
                    <li class="header">DANH MỤC QUẢN LÝ</li>
                    <li class="active nav-item" data-target="dashboard">
                        <a href="#"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
                    </li>
                    <li class="nav-item" data-target="personnel">
                        <a href="#"><i class="fas fa-users"></i> <span>Hồ sơ cán bộ</span></a>
                    </li>
                    <li class="nav-item" data-target="appendix1">
                        <a href="#"><i class="fas fa-plane-departure"></i> <span>Phụ lục 1 (Xuất cảnh)</span></a>
                    </li>
                    <li class="nav-item" data-target="appendix2">
                        <a href="#"><i class="fas fa-user-friends"></i> <span>Phụ lục 2 (Thân nhân)</span></a>
                    </li>
                    <li class="nav-item" data-target="appendix3">
                        <a href="#"><i class="fas fa-history"></i> <span>Phụ lục 3 (Lịch sử)</span></a>
                    </li>
                    <li class="header">HỆ THỐNG</li>
                    <li class="nav-item" data-target="masterdata">
                        <a href="#"><i class="fas fa-cogs"></i> <span>Danh mục (Master Data)</span></a>
                    </li>
                </ul>
            </section>
        </aside>

        <!-- Nơi chứa nội dung động (Pages) -->
        <div class="content-wrapper" id="app-content">
            <!-- Loading indicator -->
            <div id="global-loading" class="global-loading" style="display: none;">
                <i class="fas fa-spinner fa-spin fa-3x"></i>
            </div>
            
            <!-- Pages container -->
            <div id="page-container">
                <!-- Nội dung các trang sẽ được render bằng JS vào đây -->
            </div>
        </div>

        <!-- Footer -->
        <footer class="main-footer">
            <div class="pull-right hidden-xs">
                <b>Version</b> 1.0.0
            </div>
            <strong>Demo "Nhập 1 lần - Dùng nhiều nơi"</strong>
        </footer>
    </div>

    <!-- Nơi chứa Modal -->
    <div id="modal-container"></div>
    <!-- Nơi chứa Toast -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <!-- Cấu hình và thư viện cơ sở -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/api.js"></script>
    
    <!-- Components -->
    <script type="module" src="js/components/toast.js"></script>
    <script type="module" src="js/components/modal.js"></script>
    
    <!-- Services -->
    <script type="module" src="js/services/appService.js"></script>
    <script type="module" src="js/services/personnelService.js"></script>
    <script type="module" src="js/services/appendix1Service.js"></script>
    
    <!-- Main App -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
